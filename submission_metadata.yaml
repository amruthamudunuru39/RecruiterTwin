ai_usage_summary: |
  Claude (Anthropic) was used as a development assistant for code drafting, code
  review, and documentation. All architecture decisions, JD interpretation, trap
  analysis, scoring design, and validation were human-reviewed. No candidate data
  was fed to any LLM, and the ranking step itself contains zero LLM/API calls.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Evidence-based two-stage ranker for the Senior AI Engineer JD, built on one
  principle the JD itself demands: trust career-history evidence, not the skills
  list (flagged as a planted trap). Stage 1 streams all 100K candidates and scores
  JD fit from narrative text only (career descriptions, summary, titles) across the
  four must-haves — embeddings/retrieval, vector/hybrid search, shipped ranking
  systems, evaluation rigor — with diminishing-returns saturation so one buzzword is
  not depth. Explicit disqualifiers are modeled: keyword stuffers (skills present but
  never evidenced in career text), research-only and consulting-only careers,
  job-hoppers, and an experience-band falloff around the ideal 6–8 yrs. A honeypot
  plausibility filter forces internally-impossible profiles to score 0 (e.g. a skill
  used longer than the whole career). A behavioral-availability multiplier (0.45–1.10)
  folds in Redrob signals (activity recency, response rate, open-to-work, notice
  period). Stage 2 re-ranks the top-1500 shortlist with a BM25 + TF-IDF lexical blend
  (term saturation, length normalization, bigram phrase matching). Reasoning strings
  use only extracted profile facts — no hallucination. CPU-only, no network, no LLM
  calls at ranking time; ~68 s for 100K candidates, < 2 GB RAM.

